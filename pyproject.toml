[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ksim"
version = "0.1.0"
description = "ZX stabilizer-rank engine: symbolic compile + sample for Clifford and non-Clifford circuits"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.2.4",
    "stim>=1.14.0",
    "pyzx_param",
    "nanobind>=2.12.0",
]

[project.optional-dependencies]
test = ["pytest"]

[tool.setuptools.packages.find]
where = ["src/python"]
namespaces = true

[tool.setuptools.package-dir]
"" = "src/python"

[tool.setuptools.package-data]
"*" = ["*.txt", "*.md"]
